<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1180" viewBox="0 0 2200 1180"><rect width="2200" height="1180" fill="#F7FAFC"/>
<text x="96" y="88" font-family="sans-serif" font-size="46" fill="#13354B" font-weight="700">1982年美国电脑游戏：同年代发行商调查，不是历史传记选样</text>
<text x="99" y="135" font-family="sans-serif" font-size="23" fill="#61788A">1983年 Computer Gaming World《Inside the Industry》对1982年的行业回顾（受访方申报与预测严格区分）</text>
<rect x="80" y="186" width="973" height="715" rx="18" fill="#FFF" stroke="#DCE4ED"/>
<text x="112" y="242" font-size="29" font-family="sans-serif" fill="#24445A" font-weight="700">A · 发行商样本调查（158 家）</text>
<text x="112" y="280" font-size="19" font-family="sans-serif" fill="#667D8F">原文：81家有新作品，6家营业中无新作品，2家退出／停止发行，69家未回复。</text><rect x="150" y="350" width="420.37974683544303" height="130" fill="#2C7899"/><rect x="143" y="516" width="28" height="28" rx="5" fill="#2C7899"/><text x="190" y="540" font-family="sans-serif" font-size="25" fill="#2D455B">81 家申报了当年游戏</text><text x="955" y="540" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="700" fill="#385267">51.3%</text><rect x="570.379746835443" y="350" width="31.139240506329113" height="130" fill="#B58B53"/><rect x="143" y="591" width="28" height="28" rx="5" fill="#B58B53"/><text x="190" y="615" font-family="sans-serif" font-size="25" fill="#2D455B">6 家营业但无新游戏</text><text x="955" y="615" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="700" fill="#385267">3.8%</text><rect x="601.5189873417721" y="350" width="10.379746835443038" height="130" fill="#8A9AAB"/><rect x="143" y="666" width="28" height="28" rx="5" fill="#8A9AAB"/><text x="190" y="690" font-family="sans-serif" font-size="25" fill="#2D455B">2 家退出／停止出版</text><text x="955" y="690" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="700" fill="#385267">1.3%</text><rect x="611.8987341772151" y="350" width="358.1012658227848" height="130" fill="#C4CCD7"/><rect x="143" y="741" width="28" height="28" rx="5" fill="#C4CCD7"/><text x="190" y="765" font-family="sans-serif" font-size="25" fill="#2D455B">69 家未回答</text><text x="955" y="765" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="700" fill="#385267">43.7%</text><rect x="1095" y="186" width="1022" height="715" rx="18" fill="#FFF" stroke="#DCE4ED"/>
<text x="1129" y="242" font-size="29" font-family="sans-serif" fill="#24445A" font-weight="700">B · 当年新游戏数：实报 vs 推算</text><text x="1129" y="280" font-size="20" font-family="sans-serif" fill="#667D8F">单位：新发行标题；不是开发者人数，且跨平台移植的去重边界未核。</text><text x="1195" y="339" fill="#2B4558" font-size="23" font-family="sans-serif">前30家报告：302</text><rect x="1195" y="355" width="605.5329949238578" height="100" rx="7" fill="#2E799B"/><text x="1814.5329949238578" y="415" font-size="21" font-family="sans-serif" font-weight="700" fill="#2E799B">观察</text><text x="1195" y="482" fill="#2B4558" font-size="23" font-family="sans-serif">其余51家报告：92</text><rect x="1195" y="498" width="184.46700507614213" height="100" rx="7" fill="#84B3C5"/><text x="1393.4670050761422" y="558" font-size="21" font-family="sans-serif" font-weight="700" fill="#84B3C5">观察</text><text x="1195" y="625" fill="#2B4558" font-size="23" font-family="sans-serif">假定未回复企业：300</text><rect x="1195" y="641" width="601.5228426395939" height="100" rx="7" fill="#DAB46D"/><text x="1810.5228426395938" y="701" font-size="21" font-family="sans-serif" font-weight="700" fill="#DAB46D">估计</text><line x1="1155" y1="835" x2="2047" y2="835" stroke="#DCE4ED"/><text x="1164" y="873" font-size="24" font-family="sans-serif" font-weight="700" fill="#22485F">实报 394 款</text><text x="1750" y="873" font-size="23" font-family="sans-serif" font-weight="700" fill="#B98A43">预测 694 款（含推算）</text>
<rect x="83" y="936" width="2033" height="177" rx="17" fill="#E8EFF5"/>
<text x="117" y="981" font-family="sans-serif" font-size="24" font-weight="700" fill="#173B53">方法警报：394与694不能画成两个“市场实报值”；81家发行商也不能等于81家独立开发公司。</text>
<text x="117" y="1025" font-family="sans-serif" font-size="21" fill="#4E6479">前30家合计302款，覆盖 302/394=76.6% 实报新作。杂志约694款推算假设60家未回复者也发行游戏，推算300款。</text>
<text x="117" y="1065" font-family="sans-serif" font-size="19" fill="#576F82">同期杂志原文索引：CGW Vol 3.2 (1983)，Dana Lombardy / Game Merchandising；网页索引文本已提取，20MB PDF尚未视觉校对扫描页。</text>
</svg>