<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1530" viewBox="0 0 2600 1530"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 z" fill="#698298"/></marker></defs><rect width="2600" height="1530" fill="#F8FAFC"/>
<text x="92" y="79" fill="#19354D" font-family="sans-serif" font-size="43" font-weight="700">为何3D早期“画面进化，却未必内容变多”？</text>
<text x="95" y="121" fill="#617388" font-family="sans-serif" font-size="23">这是依据开发者自述和对照案例归纳的生产机制图，不是有预算分母的行业平均量化模型。</text><rect x="88" y="193" width="715" height="313" rx="18" fill="#FFFFFF" stroke="#355F92" stroke-width="3"/><rect x="88" y="193" width="715" height="10" rx="5" fill="#355F92"/><text x="116" y="244" font-size="29" font-family="sans-serif" fill="#355F92" font-weight="700">原有可负担的内容工作量</text><text x="116" y="289" font-size="23" font-family="sans-serif" fill="#3F5569">制作总工时、人月与资金上限</text><text x="116" y="323" font-size="23" font-family="sans-serif" fill="#3F5569">目标世界：任务／地点／对象</text><text x="116" y="357" font-size="23" font-family="sans-serif" fill="#3F5569">可以做很多低成本可复用块</text><text x="116" y="391" font-size="23" font-family="sans-serif" fill="#3F5569">也可以选择昂贵手工制作</text><rect x="941" y="193" width="718" height="313" rx="18" fill="#FFFFFF" stroke="#A76352" stroke-width="3"/><rect x="941" y="193" width="718" height="10" rx="5" fill="#A76352"/><text x="969" y="244" font-size="29" font-family="sans-serif" fill="#A76352" font-weight="700">早期3D化新增的制作负担</text><text x="969" y="289" font-size="23" font-family="sans-serif" fill="#3F5569">模型、贴图、骨骼、三维场景</text><text x="969" y="323" font-size="23" font-family="sans-serif" fill="#3F5569">空间碰撞、镜头、可视细节</text><text x="969" y="357" font-size="23" font-family="sans-serif" fill="#3F5569">新工具链学习与跨平台QA</text><text x="969" y="391" font-size="23" font-family="sans-serif" fill="#3F5569">目标画面越精细，单位资产越贵</text><rect x="1797" y="193" width="715" height="313" rx="18" fill="#FFFFFF" stroke="#9366A1" stroke-width="3"/><rect x="1797" y="193" width="715" height="10" rx="5" fill="#9366A1"/><text x="1825" y="244" font-size="29" font-family="sans-serif" fill="#9366A1" font-weight="700">若预算增长不足</text><text x="1825" y="289" font-size="23" font-family="sans-serif" fill="#3F5569">压缩世界范围或互动对象</text><text x="1825" y="323" font-size="23" font-family="sans-serif" fill="#3F5569">减少手工地点与任务分支</text><text x="1825" y="357" font-size="23" font-family="sans-serif" fill="#3F5569">降低画面质量或加大复用</text><text x="1825" y="391" font-size="23" font-family="sans-serif" fill="#3F5569">这是一种可能取舍，不是定律</text><line x1="807" y1="345" x2="936" y2="345" stroke="#698298" stroke-width="4" marker-end="url(#arr)"/><line x1="1664" y1="345" x2="1792" y2="345" stroke="#698298" stroke-width="4" marker-end="url(#arr)"/><text x="92" y="596" font-family="sans-serif" font-size="34" font-weight="700" fill="#19354D">四种内容生产力的补偿路径（不要求按照历史顺序发生）</text><rect x="95" y="648" width="510" height="272" rx="18" fill="#FFFFFF" stroke="#B46B49" stroke-width="3"/><rect x="95" y="648" width="510" height="10" rx="5" fill="#B46B49"/><text x="123" y="699" font-size="29" font-family="sans-serif" fill="#B46B49" font-weight="700">A  缩小空间、提高局部密度</text><text x="123" y="744" font-size="23" font-family="sans-serif" fill="#3F5569">1996《匕首雨》超大程序地理</text><text x="123" y="778" font-size="23" font-family="sans-serif" fill="#3F5569">2002《晨风》范围缩小、手工细节增加</text><text x="123" y="812" font-size="23" font-family="sans-serif" fill="#3F5569">结论：面积下降不等于内容退步</text><rect x="732" y="648" width="510" height="272" rx="18" fill="#FFFFFF" stroke="#32826F" stroke-width="3"/><rect x="732" y="648" width="510" height="10" rx="5" fill="#32826F"/><text x="760" y="699" font-size="29" font-family="sans-serif" fill="#32826F" font-weight="700">B  程序世界、规则生成内容</text><text x="760" y="744" font-size="23" font-family="sans-serif" fill="#3F5569">1984《Elite》早期2人3D系统</text><text x="760" y="778" font-size="23" font-family="sans-serif" fill="#3F5569">2009《Minecraft》体素模块化</text><text x="760" y="812" font-size="23" font-family="sans-serif" fill="#3F5569">2011《Terraria》可扩充的2D系统</text><rect x="1369" y="648" width="510" height="272" rx="18" fill="#FFFFFF" stroke="#4C72A4" stroke-width="3"/><rect x="1369" y="648" width="510" height="10" rx="5" fill="#4C72A4"/><text x="1397" y="699" font-size="29" font-family="sans-serif" fill="#4C72A4" font-weight="700">C  不追逐主流画面精细度</text><text x="1397" y="744" font-size="23" font-family="sans-serif" fill="#3F5569">2022《Ctrl Alt Ego》系统可解性</text><text x="1397" y="778" font-size="23" font-family="sans-serif" fill="#3F5569">2023《Blood West》复古3D与多路线</text><text x="1397" y="812" font-size="23" font-family="sans-serif" fill="#3F5569">2025《Peripeteia》体量须注明EA</text><rect x="2006" y="648" width="510" height="272" rx="18" fill="#FFFFFF" stroke="#9069A3" stroke-width="3"/><rect x="2006" y="648" width="510" height="10" rx="5" fill="#9069A3"/><text x="2034" y="699" font-size="29" font-family="sans-serif" fill="#9069A3" font-weight="700">D  玩家互动重复使用有限内容</text><text x="2034" y="744" font-size="23" font-family="sans-serif" fill="#3F5569">2018《Among Us》3人团队社交</text><text x="2034" y="778" font-size="23" font-family="sans-serif" fill="#3F5569">2020《Blazing Sails》3开发者选PVP</text><text x="2034" y="812" font-size="23" font-family="sans-serif" fill="#3F5569">2023《BattleBit》3署名254人服务器</text><rect x="90" y="996" width="2430" height="431" rx="18" fill="#EAF1F7"/><text x="117" y="1052" font-size="30" font-family="sans-serif" fill="#21415B" font-weight="700">直接证据：制作组自己怎样描述这类取舍？</text>
<text x="118" y="1104" font-size="23" font-family="sans-serif" fill="#334F67">• 1997 小岛秀夫：二维时代简单的地图细节，到三维制作时变得困难。</text>
<text x="118" y="1154" font-size="23" font-family="sans-serif" fill="#334F67">• 1999《System Shock 2》复盘：资源有限，选择“简单、可复用”的系统代替高昂脚本演出。</text>
<text x="118" y="1204" font-size="23" font-family="sans-serif" fill="#334F67">• 2019《Blazing Sails》开发者：三名开发人员，无力制作大量探索内容，主动选PVP大逃杀。</text>
<text x="118" y="1254" font-size="23" font-family="sans-serif" fill="#334F67">• 2024《Shadows of Doubt》：系统高度互相牵连，新增功能会冲击已有逻辑，长期修补。</text>
<text x="118" y="1315" font-size="22" font-family="sans-serif" fill="#64778C">严禁错误比较：用程序生成的陆地面积对比手工设计任务数；把重复游玩时长等于关卡制作量。</text>
<text x="118" y="1361" font-size="21" font-family="sans-serif" fill="#64778C">开发预算与团队人月仍需真实连续样本，图中没有任何臆造的成本数值。</text>
</svg>