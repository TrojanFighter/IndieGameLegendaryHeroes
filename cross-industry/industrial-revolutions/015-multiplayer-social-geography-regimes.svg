<svg xmlns="http://www.w3.org/2000/svg" width="2850" height="1450" viewBox="0 0 2850 1450"><rect width="2850" height="1450" fill="#F8FAFC"/>
<text x="82" y="75" font-family="sans-serif" font-weight="750" font-size="46" fill="#1D3850">多人游戏的4种基础设施：本地聚会 ≠ 机房LAN ≠ 早期WAN ≠ 全国在线服务</text>
<text x="85" y="118" font-family="sans-serif" font-size="23" fill="#596F81">一项玩法可同时支持多个架构；每格是有证据的项目节点，不是该技术“当年首次出现”或全国所有玩家的普及年份。</text><rect x="430" y="169" width="459" height="63" rx="11" fill="#E4EEF7"/><text x="449" y="210" font-size="26" font-family="sans-serif" font-weight="650" fill="#274761">1980s—1995</text><rect x="897" y="169" width="459" height="63" rx="11" fill="#E4EEF7"/><text x="916" y="210" font-size="26" font-family="sans-serif" font-weight="650" fill="#274761">1996—2002</text><rect x="1364" y="169" width="459" height="63" rx="11" fill="#E4EEF7"/><text x="1383" y="210" font-size="26" font-family="sans-serif" font-weight="650" fill="#274761">2003—2007</text><rect x="1831" y="169" width="459" height="63" rx="11" fill="#E4EEF7"/><text x="1850" y="210" font-size="26" font-family="sans-serif" font-weight="650" fill="#274761">2008—2013</text><rect x="2298" y="169" width="459" height="63" rx="11" fill="#E4EEF7"/><text x="2317" y="210" font-size="26" font-family="sans-serif" font-weight="650" fill="#274761">2014—2023</text><rect x="75" y="245" width="2708" height="258" rx="15" fill="#FFFFFF" stroke="#DEE7EF"/><rect x="75" y="245" width="10" height="258" rx="5" fill="#357E70"/><text x="95" y="299" font-family="sans-serif" font-size="27" font-weight="700" fill="#357E70">本地同机/同室派对</text><text x="95" y="338" font-family="sans-serif" font-size="19" fill="#62788B">单机共同模拟；分屏/多手柄</text><line x1="430" y1="261" x2="430" y2="489" stroke="#DFE7EE" stroke-width="1"/><text x="447" y="291" font-size="20" font-family="sans-serif" fill="#357E70" font-weight="650">1992  超级马里奥赛车</text><text x="447" y="329" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">同机分屏 2P</text><line x1="897" y1="261" x2="897" y2="489" stroke="#DFE7EE" stroke-width="1"/><text x="914" y="291" font-size="20" font-family="sans-serif" fill="#357E70" font-weight="650">1996  马里奥赛车64（4P）</text><text x="914" y="329" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">1998  马里奥派对（日本）</text><text x="914" y="367" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">1999  初代大乱斗</text><line x1="1364" y1="261" x2="1364" y2="489" stroke="#DFE7EE" stroke-width="1"/><text x="1381" y="291" font-size="20" font-family="sans-serif" fill="#357E70" font-weight="650">2003  双重冲击：同机模式</text><line x1="1831" y1="261" x2="1831" y2="489" stroke="#DFE7EE" stroke-width="1"/><text x="1848" y="291" font-size="20" font-family="sans-serif" fill="#357E70" font-weight="650">2008  大乱斗X：保留本地</text><line x1="2298" y1="261" x2="2298" y2="489" stroke="#DFE7EE" stroke-width="1"/><text x="2315" y="291" font-size="20" font-family="sans-serif" fill="#357E70" font-weight="650">2018  大乱斗特别版：本地8P</text><rect x="75" y="513" width="2708" height="258" rx="15" fill="#F3F7FA" stroke="#DEE7EF"/><rect x="75" y="513" width="10" height="258" rx="5" fill="#4E70AD"/><text x="95" y="567" font-family="sans-serif" font-size="27" font-weight="700" fill="#4E70AD">本地近距连机/LAN</text><text x="95" y="606" font-family="sans-serif" font-size="19" fill="#62788B">同一空间的线路/无线；局域网质量</text><line x1="430" y1="529" x2="430" y2="757" stroke="#DFE7EE" stroke-width="1"/><text x="447" y="559" font-size="20" font-family="sans-serif" fill="#4E70AD" font-weight="650">1993  DOOM IPX局域网</text><line x1="897" y1="529" x2="897" y2="757" stroke="#DFE7EE" stroke-width="1"/><text x="914" y="559" font-size="20" font-family="sans-serif" fill="#4E70AD" font-weight="650">1997  帝国时代（LAN）</text><text x="914" y="597" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">1998  星际争霸（LAN）</text><text x="914" y="635" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">1999  CS早期社区局域网</text><line x1="1364" y1="529" x2="1364" y2="757" stroke="#DFE7EE" stroke-width="1"/><text x="1381" y="559" font-size="20" font-family="sans-serif" fill="#4E70AD" font-weight="650">2003  双重冲击：GC LAN</text><text x="1381" y="597" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">2005  马里奥赛车DS：8人近距无线</text><line x1="1831" y1="529" x2="1831" y2="757" stroke="#DFE7EE" stroke-width="1"/><text x="1848" y="559" font-size="20" font-family="sans-serif" fill="#4E70AD" font-weight="650">持续存在：局域/同室玩法</text><line x1="2298" y1="529" x2="2298" y2="757" stroke="#DFE7EE" stroke-width="1"/><text x="2315" y="559" font-size="20" font-family="sans-serif" fill="#4E70AD" font-weight="650">局域机制未被互联网淘汰</text><rect x="75" y="781" width="2708" height="258" rx="15" fill="#FFFFFF" stroke="#DEE7EF"/><rect x="75" y="781" width="10" height="258" rx="5" fill="#AD7045"/><text x="95" y="835" font-family="sans-serif" font-size="27" font-weight="700" fill="#AD7045">早期互联网实时对战</text><text x="95" y="874" font-family="sans-serif" font-size="19" fill="#62788B">拨号WAN、服务器列表、延迟工程</text><line x1="430" y1="797" x2="430" y2="1025" stroke="#DFE7EE" stroke-width="1"/><text x="447" y="827" font-size="20" font-family="sans-serif" fill="#AD7045" font-weight="650">早期互联网条件不一</text><line x1="897" y1="797" x2="897" y2="1025" stroke="#DFE7EE" stroke-width="1"/><text x="914" y="827" font-size="20" font-family="sans-serif" fill="#AD7045" font-weight="650">1996  QuakeWorld：拨号优化</text><text x="914" y="865" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">1997  帝国时代（Internet）</text><text x="914" y="903" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">1998  星际争霸（Battle.net）</text><text x="914" y="941" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">1999/2000  CS公网服务器</text><line x1="1364" y1="797" x2="1364" y2="1025" stroke="#DFE7EE" stroke-width="1"/><text x="1381" y="827" font-size="20" font-family="sans-serif" fill="#AD7045" font-weight="650">2000  梦幻之星Online（4人）</text><text x="1381" y="865" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">2005  DS：4人互联网赛车</text><line x1="1831" y1="797" x2="1831" y2="1025" stroke="#DFE7EE" stroke-width="1"/><text x="1848" y="827" font-size="20" font-family="sans-serif" fill="#AD7045" font-weight="650">2008  大乱斗X：Wi-Fi对战</text><line x1="2298" y1="797" x2="2298" y2="1025" stroke="#DFE7EE" stroke-width="1"/><text x="2315" y="827" font-size="20" font-family="sans-serif" fill="#AD7045" font-weight="650">2018  大乱斗特别版：在线4P</text><rect x="75" y="1049" width="2708" height="258" rx="15" fill="#F3F7FA" stroke="#DEE7EF"/><rect x="75" y="1049" width="10" height="258" rx="5" fill="#9164A7"/><text x="95" y="1103" font-family="sans-serif" font-size="27" font-weight="700" fill="#9164A7">跨地区服务化匹配/运营</text><text x="95" y="1142" font-family="sans-serif" font-size="19" fill="#62788B">账户、好友/大厅、分区服务器、支付与运维</text><line x1="430" y1="1065" x2="430" y2="1293" stroke="#DFE7EE" stroke-width="1"/><text x="447" y="1095" font-size="20" font-family="sans-serif" fill="#9164A7" font-weight="650">萌芽；非全国普及</text><line x1="897" y1="1065" x2="897" y2="1293" stroke="#DFE7EE" stroke-width="1"/><text x="914" y="1095" font-size="20" font-family="sans-serif" fill="#9164A7" font-weight="650">1996  Battle.net前身发展</text><text x="914" y="1133" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">1998  星际争霸世界排名</text><line x1="1364" y1="1065" x2="1364" y2="1293" stroke="#DFE7EE" stroke-width="1"/><text x="1381" y="1095" font-size="20" font-family="sans-serif" fill="#9164A7" font-weight="650">2005  任天堂Wi-Fi Connection</text><text x="1381" y="1133" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">2007  CF韩国商业运营</text><line x1="1831" y1="1065" x2="1831" y2="1293" stroke="#DFE7EE" stroke-width="1"/><text x="1848" y="1095" font-size="20" font-family="sans-serif" fill="#9164A7" font-weight="650">2008  CF中国商业服务</text><text x="1848" y="1133" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">2009  CF中国同时在线百万</text><text x="1848" y="1171" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">2008  大乱斗线上陌生人</text><line x1="2298" y1="1065" x2="2298" y2="1293" stroke="#DFE7EE" stroke-width="1"/><text x="2315" y="1095" font-size="20" font-family="sans-serif" fill="#9164A7" font-weight="650">2018  区域优先匹配仍存在</text><text x="2315" y="1133" font-size="20" font-family="sans-serif" fill="#284258" font-weight="400">2023  独立多人产品持续扩散</text><rect x="82" y="1330" width="2680" height="88" rx="15" fill="#E8EFF5"/><text x="110" y="1366" font-size="22" font-family="sans-serif" font-weight="700" fill="#1C3D58">关键限制：1997《帝国时代》、1998《星际争霸》已能公网对战；早期 CS 也有公网服务器，不能称为“只支持局域网”。</text><text x="110" y="1400" font-size="20" font-family="sans-serif" fill="#526C80">2008 CF主要是全国性商业服务的成熟和玩家可达性扩展，绝非FPS互联网算法在此刻才诞生。详细来源：015事件CSV及015研究。</text></svg>