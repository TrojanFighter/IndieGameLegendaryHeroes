<text x="138" y="1156" font-family="sans-serif" font-size="23" font-weight="700" fill="#254862">重要异常：1997 CNNIC首报为62万人，后出汇总表作63万人；此图用首报原始数值。</text>
<text x="138" y="1197" font-family="sans-serif" font-size="21" fill="#597288">1997观察截至10月、1998截至6月，其他取年末；统计口径随年代调整。没有逐年RTT/丢包率，不能据此推网络电竞“可玩率”。</text></svg>