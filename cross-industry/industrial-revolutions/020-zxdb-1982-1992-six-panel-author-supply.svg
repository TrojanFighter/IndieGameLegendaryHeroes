<text x="90" y="78" font-family="sans-serif" font-size="47" fill="#16354B" font-weight="700">英国 ZX Spectrum 1982—1992：11年实际署名作者人口调查</text>
<text x="91" y="121" font-family="sans-serif" font-size="23" fill="#5D7285">ZXDB 固定快照 MariaDB 实算 · 32个含“Game”的历史分类 · 原始独立发行版本 · 个人署名归一</text>
<text x="91" y="156" font-family="sans-serif" font-size="20" fill="#6A8094">“个人作者”不等于独立工作室；存在只发行于合辑、磁带封面及无原始日期的遗漏；历史类别并非Steam标签。</text><rect x="85" y="210" width="1125" height="565" rx="17" fill="white" stroke="#DFE7EE"/>
