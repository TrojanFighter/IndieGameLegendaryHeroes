<text x="130" y="1140" font-family="sans-serif" font-size="22" font-weight="700" fill="#24465E">韩国宽带基础设施约领先美日数年，但宽带订阅数量不直接等于客户端时延、网络对局质量或在线游戏渗透率。</text>
<text x="130" y="1175" font-family="sans-serif" font-size="19" fill="#5B7184">本图仅对比同一OECD统计口径，原始采集刊于2009年，详见 016-oecd-fixed-broadband-three-countries-2003-2008.csv。</text></svg>