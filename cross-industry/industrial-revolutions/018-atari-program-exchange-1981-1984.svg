<svg xmlns="http://www.w3.org/2000/svg" width="2180" height="1030" viewBox="0 0 2180 1030"><rect width="2180" height="1030" fill="#F7FAFC"/>
<text x="100" y="75" font-size="43" font-family="sans-serif" fill="#17354C" font-weight="700">APX（1981—1984）：大型平台＋业余作者的早期量产接口</text>
<text x="100" y="115" font-size="23" font-family="sans-serif" fill="#617588">不是现代 UGC；邮购目录、平台审核、作者版税、专业分销与商业退出</text>
<rect x="100" y="172" width="1980" height="127" rx="20" fill="#E6EEF6"/>
<text x="135" y="221" font-size="26" font-family="sans-serif" fill="#1F4159" font-weight="700">个人作者提交程序</text>
<text x="135" y="266" font-size="22" font-family="sans-serif" fill="#536A7F">→ Atari 评审／合同／包装印刷／邮购／收款 → 作者获得APX净收款额的10%版税</text>
<line x1="255" y1="393" x2="1920" y2="393" stroke="#A6B9C8" stroke-width="8" stroke-linecap="round"/><circle cx="290" cy="393" r="19" fill="#2D7493" stroke="#FFF" stroke-width="5"/><line x1="290" y1="393" x2="290" y2="360" stroke="#2D7493" stroke-width="3"/><text x="290" y="345" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#2D7493">1981</text><text x="290" y="513" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#254359">APX创办</text><text x="290" y="549" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#576C7F">用户内容发行渠道</text><circle cx="780" cy="393" r="19" fill="#2D7493" stroke="#FFF" stroke-width="5"/><line x1="780" y1="393" x2="780" y2="446" stroke="#2D7493" stroke-width="3"/><text x="780" y="460" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#2D7493">1982</text><text x="780" y="518" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#254359">20款年度新游戏</text><text x="780" y="554" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#576C7F">CGW当期问卷名单</text><circle cx="1290" cy="393" r="19" fill="#B38244" stroke="#FFF" stroke-width="5"/><line x1="1290" y1="393" x2="1290" y2="360" stroke="#B38244" stroke-width="3"/><text x="1290" y="345" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#B38244">1983年6月</text><text x="1290" y="513" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#254359">目录已有170+种软件</text><text x="1290" y="549" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#576C7F">包括非游戏软件</text><circle cx="1810" cy="393" r="19" fill="#8E6B71" stroke="#FFF" stroke-width="5"/><line x1="1810" y1="393" x2="1810" y2="446" stroke="#8E6B71" stroke-width="3"/><text x="1810" y="460" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#8E6B71">1984</text><text x="1810" y="518" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#254359">邮购体系停运</text><text x="1810" y="554" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#576C7F">商业可持续另证</text><rect x="100" y="627" width="945" height="230" rx="20" fill="#FFFFFF" stroke="#DEE6EE"/>
<text x="135" y="676" font-size="27" font-family="sans-serif" font-weight="700" fill="#25425B">平台提供的是“产业中介”</text>
<text x="135" y="724" font-size="21" font-family="sans-serif" fill="#53697E">审核 → 质量控制 → 包装 → 目录 → 邮购 → 结算</text>
<text x="135" y="773" font-size="20" font-family="sans-serif" fill="#53697E">不要求每位作者自建发行、分销、收款系统</text>
<text x="135" y="818" font-size="20" font-family="sans-serif" fill="#53697E">仍然存在选稿门槛与实体软件成本</text>
<rect x="1112" y="627" width="968" height="230" rx="20" fill="#FFFFFF" stroke="#DEE6EE"/>
<text x="1148" y="676" font-size="27" font-family="sans-serif" font-weight="700" fill="#25425B">两组数量不应画成一条增长曲线</text>
<text x="1148" y="723" font-size="20" font-family="sans-serif" fill="#53697E">20 = 1982年新游戏；170+ = 1983年全部在售软件存量</text>
<text x="1148" y="770" font-size="20" font-family="sans-serif" fill="#53697E">分子／分母／游戏占比／作者ID均不同</text>
<text x="1148" y="817" font-size="20" font-family="sans-serif" fill="#53697E">不得得出“1983年产量较1982年增长8.5倍”</text>
<text x="102" y="930" font-size="22" font-family="sans-serif" fill="#284A60" font-weight="700">对技术分代的启示：可供作者利用的市场基础设施，是独立于2D/3D图形与游戏引擎的生产能力轴。</text>
<text x="102" y="971" font-size="18" font-family="sans-serif" fill="#6A7D8E">数据来源：Antic (1983)《APX: On top of the heap》；CGW 3.2 (1983) 1982年回顾；APX刊物与管理者回忆。</text></svg>