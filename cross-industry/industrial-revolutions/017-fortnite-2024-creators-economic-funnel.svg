<rect width="2070" height="1530" fill="#FAFBFD"/>
<text x="108" y="80" font-family="sans-serif" font-size="46" fill="#17334A" font-weight="700">2024 Fortnite：创作者数量 ≠ 有收入的职业创作者</text>
<text x="111" y="121" font-size="23" fill="#5B7287" font-family="sans-serif">Epic 官方 2024 年图表；各档是“至少达到该金额”的包含式门槛，数字不可相加！</text>
<rect x="95" y="165" width="1870" height="95" rx="16" fill="#E8EFF7"/>
<text x="123" y="205" font-size="24" font-family="sans-serif" fill="#1D4058" font-weight="700">2024 全年生态创作者 ~70,000｜发布岛屿 198,000｜发给创作者 $352 million</text>
<text x="123" y="239" font-size="19" font-family="sans-serif" fill="#546B81">137,000 张岛屿使用 UEFN；以上都是 Creative＋UEFN 整体口径，不是 standalone 游戏开发商。</text><line x1="733.3438329791062" y1="322" x2="733.3438329791062" y2="1248" stroke="#DFE7EF" stroke-width="1"/><text x="733.3438329791062" y="311" text-anchor="middle" fill="#71859A" font-size="18" font-family="sans-serif">1</text><line x1="901.4308167467863" y1="322" x2="901.4308167467863" y2="1248" stroke="#DFE7EF" stroke-width="1"/><text x="901.4308167467863" y="311" text-anchor="middle" fill="#71859A" font-size="18" font-family="sans-serif">10</text><line x1="1120.0476935167553" y1="322" x2="1120.0476935167553" y2="1248" stroke="#DFE7EF" stroke-width="1"/><text x="1120.0476935167553" y="311" text-anchor="middle" fill="#71859A" font-size="18" font-family="sans-serif">100</text><line x1="1346.1984466988483" y1="322" x2="1346.1984466988483" y2="1248" stroke="#DFE7EF" stroke-width="1"/><text x="1346.1984466988483" y="311" text-anchor="middle" fill="#71859A" font-size="18" font-family="sans-serif">1k</text><line x1="1573.1430549802565" y1="322" x2="1573.1430549802565" y2="1248" stroke="#DFE7EF" stroke-width="1"/><text x="1573.1430549802565" y="311" text-anchor="middle" fill="#71859A" font-size="18" font-family="sans-serif">10k</text><line x1="1765" y1="322" x2="1765" y2="1248" stroke="#DFE7EF" stroke-width="1"/><text x="1765" y="311" text-anchor="middle" fill="#71859A" font-size="18" font-family="sans-serif">70k</text><text x="116" y="398" font-size="22" font-family="sans-serif" fill="#2A4356">所有活跃创作者（全年口径）</text><rect x="665" y="365" width="1100" height="48" rx="9" fill="#486A8B"/><text x="1783" y="399" font-size="25" font-family="sans-serif" font-weight="700" fill="#486A8B">70,000</text><text x="116" y="496" font-size="22" font-family="sans-serif" fill="#2A4356">年度获支付 ≥ $100</text><rect x="665" y="463" width="933.3171462570555" height="48" rx="9" fill="#387E97"/><text x="1616.3171462570554" y="497" font-size="25" font-family="sans-serif" font-weight="700" fill="#387E97">12,909</text><text x="116" y="594" font-size="22" font-family="sans-serif" fill="#2A4356">年度获支付 ≥ $1,000</text><rect x="665" y="561" width="846.6261871822521" height="48" rx="9" fill="#387E97"/><text x="1529.6261871822521" y="595" font-size="25" font-family="sans-serif" font-weight="700" fill="#387E97">5,358</text><text x="116" y="692" font-size="22" font-family="sans-serif" fill="#2A4356">年度获支付 ≥ $10,000</text><rect x="665" y="659" width="735.0872784382001" height="48" rx="9" fill="#387E97"/><text x="1418.0872784382" y="693" font-size="25" font-family="sans-serif" font-weight="700" fill="#387E97">1,728</text><text x="116" y="790" font-size="22" font-family="sans-serif" fill="#2A4356">年度获支付 ≥ $100,000</text><rect x="665" y="757" width="595.3299000180718" height="48" rx="9" fill="#B27A46"/><text x="1278.3299000180718" y="791" font-size="25" font-family="sans-serif" font-weight="700" fill="#B27A46">418</text><text x="116" y="888" font-size="22" font-family="sans-serif" fill="#2A4356">年度获支付 ≥ $300,000</text><rect x="665" y="855" width="497.27823108926054" height="48" rx="9" fill="#B27A46"/><text x="1180.2782310892605" y="889" font-size="25" font-family="sans-serif" font-weight="700" fill="#B27A46">154</text><text x="116" y="986" font-size="22" font-family="sans-serif" fill="#2A4356">年度获支付 ≥ $1,000,000</text><rect x="665" y="953" width="358.6634814652443" height="48" rx="9" fill="#9651A6"/><text x="1041.6634814652443" y="987" font-size="25" font-family="sans-serif" font-weight="700" fill="#9651A6">37</text><text x="116" y="1084" font-size="22" font-family="sans-serif" fill="#2A4356">年度获支付 ≥ $3,000,000</text><rect x="665" y="1051" width="267.0118783339092" height="48" rx="9" fill="#9651A6"/><text x="950.0118783339092" y="1085" font-size="25" font-family="sans-serif" font-weight="700" fill="#9651A6">14</text><text x="116" y="1182" font-size="22" font-family="sans-serif" fill="#2A4356">年度获支付 ≥ $10,000,000</text><rect x="665" y="1149" width="205.03149893731845" height="48" rx="9" fill="#9651A6"/><text x="888.0314989373185" y="1183" font-size="25" font-family="sans-serif" font-weight="700" fill="#9651A6">7</text><text x="111" y="1310" font-size="25" font-family="sans-serif" font-weight="700" fill="#234157">分母比较：37 / 70,000 ≈ 0.053%；12,909 / 70,000 ≈ 18.44%</text>
<text x="111" y="1350" font-size="21" font-family="sans-serif" fill="#52677B">注意：70k 为约数、计量口径与支付图未作个人身份逐一对齐，比例为近似比例。</text>
<text x="111" y="1389" font-size="21" font-family="sans-serif" fill="#52677B">横轴是对数尺度，因此条形长度不能做线性面积比较。收入不是利润，更不等于全职可持续收入。</text>
<text x="111" y="1435" font-size="19" font-family="sans-serif" fill="#52677B">来源：Epic《Fortnite Ecosystem 2024 Year in Review》原始嵌入图。图中脚注写明“Counts per tier are inclusive”。</text>
<text x="111" y="1469" font-size="18" font-family="sans-serif" fill="#6B7F91">本图没有把 $1M+ 37、$3M+ 14、$10M+ 7 相加。部分二手媒体相加得到 58 人属于重复计数。</text>
