name: research-lint

on:
  push:
    paths:
      - 'README.md'
      - 'WORKFLOW.md'
      - 'book/**'
      - 'cases/**'
      - 'claims/**'
      - 'evidence/**'
      - 'metadata/**'
      - 'schemas/**'
      - 'tools/research_lint.py'
      - 'tools/research_evidence_lint.py'
      - 'tools/reader_layer_lint.py'
      - 'tools/context_audit_lint.py'
      - '.github/workflows/research-lint.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'WORKFLOW.md'
      - 'book/**'
      - 'cases/**'
      - 'claims/**'
      - 'evidence/**'
      - 'metadata/**'
      - 'schemas/**'
      - 'tools/research_lint.py'
      - 'tools/research_evidence_lint.py'
      - 'tools/reader_layer_lint.py'
      - 'tools/context_audit_lint.py'
      - '.github/workflows/research-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run structural research integrity checks
        run: python tools/research_lint.py --strict
      - name: Run evidence and audit maturity checks
        run: python tools/research_evidence_lint.py
      - name: Run context-situation-action checks
        run: python tools/context_audit_lint.py
      - name: Run reader-layer drift checks
        run: python tools/reader_layer_lint.py
