name: research-lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Run YAML frontmatter syntax checks
        run: python tools/frontmatter_yaml_lint.py
      - name: Run structural research integrity checks
        run: python tools/research_lint.py --strict
      - name: Run evidence and audit maturity checks
        run: python tools/research_evidence_lint.py
      - name: Run context-situation-action checks
        run: python tools/context_audit_lint.py
      - name: Check Case graduation eligibility boundaries
        run: python tools/case_maturity.py --check
      - name: Run reader-layer drift checks
        run: python tools/reader_layer_lint.py
      - name: Check chapter prose for backend vocabulary
        run: python tools/chapter_copy_lint.py
      - name: Run Case Explorer metadata contract checks
        run: python tools/explorer_lint.py
      - name: Check translation registry and source versions
        run: python tools/translation_lint.py
      - name: Check sister-program inventory and boundaries
        run: python tools/slavic_research_lint.py
      - name: Test public-content, translation and sister-program guards
        run: python -m unittest discover -s tests -p 'test_*.py'
