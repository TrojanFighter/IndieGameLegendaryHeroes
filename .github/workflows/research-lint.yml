name: research-lint

on:
  push:
    paths:
      - 'cases/**'
      - 'claims/**'
      - 'evidence/**'
      - 'metadata/**'
      - 'schemas/**'
      - 'tools/research_lint.py'
      - '.github/workflows/research-lint.yml'
  pull_request:
    paths:
      - 'cases/**'
      - 'claims/**'
      - 'evidence/**'
      - 'metadata/**'
      - 'schemas/**'
      - 'tools/research_lint.py'
      - '.github/workflows/research-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run research integrity checks
        run: python tools/research_lint.py --strict
