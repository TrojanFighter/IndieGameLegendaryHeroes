name: branch-hygiene

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup-merged-chatgpt-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch remote branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Record open PR branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr list --state open --json headRefName --jq '.[].headRefName' > open-pr-branches.txt

      - name: Delete merged chatgpt branches without open PRs
        run: |
          set -euo pipefail
          git branch -r --merged origin/main \
            | sed 's/^ *//' \
            | sed 's#^origin/##' \
            | grep '^chatgpt/' \
            | while IFS= read -r branch; do
                if grep -Fxq "$branch" open-pr-branches.txt; then
                  echo "skip open PR branch: $branch"
                  continue
                fi
                echo "delete merged branch: $branch"
                git push origin --delete "$branch"
              done
